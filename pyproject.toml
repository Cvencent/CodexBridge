[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexbridge"
version = "0.1.0"
description = "Unified LAN bridge for Codex-aware devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=10"]

[tool.setuptools]
packages = ["codexbridge", "codexbridge.protocol", "codexbridge.devices"]
