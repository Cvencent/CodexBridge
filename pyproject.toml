[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexbridge"
version = "1.3.0"
description = "Unified LAN bridge for Codex-aware devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
tray = ["pystray>=0.19", "Pillow>=10"]

[tool.setuptools]
packages = [
    "codexbridge",
    "codexbridge.codex",
    "codexbridge.protocol",
    "codexbridge.devices",
]

[tool.setuptools.package-data]
codexbridge = ["windows_speech_recognize.ps1"]
