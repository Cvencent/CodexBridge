name: release-windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt
      - name: Run tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build portable and installer
        shell: pwsh
        run: |
          $version = (python -c "import codexbridge; print(codexbridge.VERSION)")
          ./packaging/build_windows.ps1 -Version $version
      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (python -c "import codexbridge; print(codexbridge.VERSION)")
          $notes = Join-Path $PWD "release-notes/v$version.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing Chinese release notes: release-notes/v$version.md"
          }
          gh release view "v$version" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "v$version" --title "CodexBridge v$version" --notes-file $notes
          }
          gh release upload "v$version" release/* --clobber
          Write-Host "Uploaded CodexBridge-Setup-$version-win64.exe and portable package"
          gh release edit "v$version" --title "CodexBridge v$version" --notes-file $notes
